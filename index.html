<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSEN Grid Capacity Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5f6b7a; --line: #dfe3e8;
    --accent: #0b6bcb; --green: #2e9d5b; --amber: #e0a100; --red: #d64545; --grey: #9aa4b1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --panel: #1b2027; --ink: #e8ecf1; --muted: #9aa6b4; --line: #2c333d; --accent: #5aa7ff;
    }
  }
  :root[data-theme="dark"] { --bg: #12151a; --panel: #1b2027; --ink: #e8ecf1; --muted: #9aa6b4; --line: #2c333d; --accent: #5aa7ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  #map { height: 100%; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .group { margin-bottom: 16px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { flex: 1 1 auto; padding: 6px 8px; border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 6px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=search] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; }
  label.chk { display: flex; gap: 8px; align-items: center; margin: 4px 0; cursor: pointer; }
  .crumbs { font-size: 13px; }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .legend { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .ramp { height: 10px; border-radius: 4px; }
  .ramp-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; }
  .leaflet-popup-content { font-size: 12.5px; min-width: 260px; }
  .pop h3 { margin: 0 0 4px; font-size: 14px; }
  .pop table { border-collapse: collapse; width: 100%; }
  .pop td { padding: 2px 0; vertical-align: top; }
  .pop td:first-child { color: #5f6b7a; padding-right: 10px; white-space: nowrap; }
  .pop button { margin-top: 8px; padding: 5px 10px; border: 0; border-radius: 5px; background: #0b6bcb; color: #fff; cursor: pointer; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 9px; color: #fff; font-size: 11px; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>SSEN Grid Capacity Map</h1>
    <div class="sub">Distribution network headroom by supply area · source: SSEN open data</div>

    <div class="group">
      <div class="label">Network level</div>
      <div class="seg" id="levels">
        <button data-level="gsp">GSP</button>
        <button data-level="bsp">BSP</button>
        <button data-level="primary">Primary</button>
        <button data-level="secondary">Secondary</button>
        <button data-level="smart">Smart meter</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Colour by</div>
      <div class="seg" id="metrics">
        <button data-metric="dRAG">Demand RAG</button>
        <button data-metric="gRAG">Generation RAG</button>
        <button data-metric="dHead">Demand headroom</button>
        <button data-metric="gHead">Gen headroom</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Drill-down</div>
      <div class="crumbs" id="crumbs"></div>
    </div>

    <div class="group">
      <input type="search" id="q" placeholder="Find a substation…" list="names">
      <datalist id="names"></datalist>
    </div>

    <div class="group">
      <div class="label">Overlays</div>
      <label class="chk"><input type="checkbox" id="showSubs"> Substation locations</label>
      <label class="chk"><input type="checkbox" id="showLicence" checked> Licence areas</label>
    </div>

    <div class="group">
      <div class="label">Legend</div>
      <div id="legend"></div>
    </div>

    <div class="group">
      <div class="label">In view</div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="group note" id="levelNote"></div>
  </aside>
  <div id="map"></div>
</div>

<script>
const RAG = { Green: getCss('--green'), Amber: getCss('--amber'), Red: getCss('--red') };
function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

const LEVELS = {
  gsp:     { file: 'data/gsp.geojson',     id: 'GSP_ID',     name: p => p.GSP_NAME || p.Substation, child: 'bsp',     childKey: 'Up_GSP_ID', label: 'GSP' },
  bsp:     { file: 'data/bsp.geojson',     id: 'BSP_ID',     name: p => p.BSP_NAME || p.Substation, child: 'primary', childKey: 'Up_BSP_ID', parentKey: 'Up_GSP_ID', label: 'BSP' },
  primary: { file: 'data/primary.geojson', id: 'PRIMARY_ID', name: p => p.PRIMARY_NAME_2025 || p.Substation, parentKey: 'Up_BSP_ID', label: 'Primary', child: 'secondary' },
  secondary: { label: 'secondary area' },
};
const NOTES = {
  gsp: 'Grid Supply Points: transmission→distribution interface (132kV/33kV). Click an area to drill into its BSPs.',
  bsp: 'Bulk Supply Points: 132/33kV substations. Click an area to drill into its primaries.',
  primary: 'Primary substations: 33/11kV. Headroom and RAG come from SSEN\'s January 2026 capacity data.',
  secondary: 'Secondary substation (11kV/LV) supply areas for the selected primary, coloured by smart meter peak load where available. Drill in from a primary, or pick one here.',
  smart: 'Smart meter load intensity: peak kW per connected smart meter for each secondary area in the selected primary. Click an area for its LV feeder breakdown.',
};

const state = { level: 'gsp', metric: 'dRAG', filter: null, trail: [] };
const data = {};
const map = L.map('map', { preferCanvas: true }).setView([54.8, -3.2], 6);
const basemaps = {
  'Light grey': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Basemap &copy; Esri · Network data &copy; SSEN (CC BY 4.0)', maxNativeZoom: 16, maxZoom: 19 }),
  'Streets': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors · Network data &copy; SSEN (CC BY 4.0)', maxZoom: 19 }),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Imagery &copy; Esri · Network data &copy; SSEN (CC BY 4.0)', maxZoom: 19 }),
};
basemaps['Light grey'].addTo(map);
L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

let areaLayer = null, subsLayer = null, licenceLayer = null, secLayers = null;

const fmt = (v, u) => v == null || isNaN(v) ? '–' : `${(+v).toFixed(1)} ${u}`;
const metricVal = (p, m) => m === 'dHead' ? p.Estimated_Demand_Headroom__MVA_ : p.Estimated_Generation_Headroom__MW_;
const RAMP = ['#d64545', '#e8833a', '#e0c200', '#8cc152', '#2e9d5b'];
const BREAKS = { dHead: [0, 5, 15, 40], gHead: [0, 5, 15, 40] };

function colourFor(p) {
  const m = state.metric;
  if (m === 'dRAG') return RAG[p.Substation_Demand_RAG_Status] || getCss('--grey');
  if (m === 'gRAG') return RAG[p.Substation_Generation_RAG_Status] || getCss('--grey');
  const v = metricVal(p, m);
  if (v == null) return getCss('--grey');
  const b = BREAKS[m]; let i = 0; while (i < b.length && v > b[i]) i++;
  return RAMP[i];
}

async function load(name, file) {
  if (data[name]) return data[name];
  const r = await fetch(file);
  if (!r.ok) return null;
  return (data[name] = await r.json());
}

function popupHtml(p, lvl) {
  const cfg = LEVELS[lvl];
  const pill = s => s ? `<span class="pill" style="background:${RAG[s] || '#9aa4b1'}">${s}</span>` : '–';
  const rows = [
    ['Upstream', [p.Upstream_GSP, p.Upstream_BSP].filter(Boolean).join(' → ') || '–'],
    ['Voltage', p.Voltage__kV_ ? p.Voltage__kV_ + ' kV' : '–'],
    ['Transformers', p.Transformer_Nameplate_Ratings || '–'],
    ['Max demand', fmt(p.Maximum_Observed_Gross_Demand__MVA_, 'MVA')],
    ['Demand headroom', fmt(p.Estimated_Demand_Headroom__MVA_, 'MVA') + ' ' + pill(p.Substation_Demand_RAG_Status)],
    ['Demand constraint', p.Demand_Constraint || '–'],
    ['Connected gen', fmt(p.Connected_Generation__MW_, 'MW')],
    ['Contracted gen', fmt(p.Contracted_Generation__MW_, 'MW')],
    ['Gen headroom', fmt(p.Estimated_Generation_Headroom__MW_, 'MW') + ' ' + pill(p.Substation_Generation_RAG_Status)],
    ['Gen constraint', p.Generation_Constraint || '–'],
    ['Fault level', p.F3_Phase_Break_Fault_Level__kA_ ? `${(+p.F3_Phase_Break_Fault_Level__kA_).toFixed(1)} / ${p.F3_Phase_Break_Fault_Rating__kA_} kA` : '–'],
    ['Reinforcement', p.Substation_Reinforcement_Works ? `${p.Substation_Reinforcement_Works} (${p.Substation_Reinforcement_Completion_Date || 'tbc'})` : '–'],
  ];
  const btn = cfg && cfg.child ? `<button data-drill="${p[cfg.id]}">Show ${LEVELS[cfg.child].label}s in this area →</button>` : '';
  return `<div class="pop"><h3>${cfg ? cfg.name(p) : p.Substation}</h3><div style="color:#5f6b7a;margin-bottom:6px">${p.Substation_Type || ''} · ${p.Map___License_Area || ''}</div>
    <table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>${btn}</div>`;
}

async function render(fit) {
  if (areaLayer) { map.removeLayer(areaLayer); areaLayer = null; }
  if (secLayers) { secLayers.forEach(l => map.removeLayer(l)); secLayers = null; }
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', b.dataset.level === state.level));
  document.querySelectorAll('#metrics button').forEach(b => b.classList.toggle('on', b.dataset.metric === state.metric));
  document.getElementById('levelNote').textContent = NOTES[state.level];
  renderCrumbs();
  renderLegend();

  if (state.level === 'secondary' || state.level === 'smart') return renderSecondary();

  const cfg = LEVELS[state.level];
  const fc = await load(state.level, cfg.file);
  const feats = fc.features.filter(f => !state.filter || f.properties[state.filter.key] === state.filter.value);
  areaLayer = L.geoJSON({ type: 'FeatureCollection', features: feats }, {
    style: f => ({ color: '#ffffff', weight: 0.8, fillColor: colourFor(f.properties), fillOpacity: 0.62 }),
    onEachFeature: (f, layer) => {
      layer.bindPopup(() => popupHtml(f.properties, state.level), { maxWidth: 360 });
      layer.bindTooltip(cfg.name(f.properties), { sticky: true });
      layer.on('mouseover', () => layer.setStyle({ weight: 2.5, color: '#1b1f24' }));
      layer.on('mouseout', () => areaLayer && areaLayer.resetStyle(layer));
    }
  }).addTo(map);
  if (fit && feats.length) map.fitBounds(areaLayer.getBounds(), { padding: [20, 20] });
  renderStats(feats.map(f => f.properties));
  fillSearch(feats.map(f => cfg.name(f.properties)));
}

const currentPrimary = () => [...state.trail].reverse().find(t => t.level === 'primary');

async function secondaryFile(nrn) {
  const idx = await load('secondary_index', 'data/secondary/index.json').catch(() => null);
  if (!idx) return null;
  const v = String(nrn);
  const key = [v, v.padStart(4, '0'), v.split('-')[0], v.split('-')[0].padStart(4, '0')].find(k => idx[k]);
  return key ? `data/secondary/${encodeURIComponent(idx[key])}.geojson` : undefined;
}

const SM_RAMP = ['#2e9d5b', '#8cc152', '#e0c200', '#e8833a', '#d64545'];  // low → high load
function smColour(v, breaks) {
  if (v == null) return getCss('--grey');
  let i = 0; while (i < breaks.length && v > breaks[i]) i++;
  return SM_RAMP[i];
}

async function renderSecondary() {
  const prim = currentPrimary();
  if (!prim) {
    renderStats(null, [['–', 'pick a primary first']]);
    document.getElementById('levelNote').textContent = 'Choose Primary, click an area, then “Show secondary areas…”.';
    fillSearch([]); return;
  }
  const file = await secondaryFile(prim.nrn);
  if (file === null) { renderStats(null, [['–', 'run fetch_portal.py to download secondary areas']]); return; }
  if (!file) { renderStats(null, [['0', `secondary areas published for primary ${prim.nrn}`]]); return; }
  const [fc, sm] = await Promise.all([fetch(file).then(r => r.json()), load('smart', 'data/smart_meter_secondary.json').catch(() => null)]);
  const smx = sm ? sm.secondaries : {};
  const intensity = state.level === 'smart';
  const val = p => { const d = smx[p.NRN_10_DIGIT]; if (!d) return null; return intensity ? (d.meters ? d.peak_kw / d.meters : null) : d.peak_kw; };
  // bands from Jan 2026 winter-weekday data: roughly the 25th/50th/75th/95th percentiles
  const breaks = intensity ? [0.8, 1.0, 1.6, 3.0] : [25, 50, 85, 150];
  const layer = L.geoJSON(fc, {
    style: f => ({ color: '#ffffff', weight: 0.6, fillColor: smColour(val(f.properties), breaks), fillOpacity: 0.7 }),
    onEachFeature: (f, l) => {
      const p = f.properties, d = smx[p.NRN_10_DIGIT];
      l.bindTooltip(d && d.name ? d.name : `Secondary ${p.TX_NRN}`, { sticky: true });
      l.bindPopup(() => `<div class="pop"><h3>${d && d.name ? d.name : 'Secondary ' + p.TX_NRN}</h3>
        <div style="color:#5f6b7a;margin-bottom:6px">${p.GSP_NAME} › ${p.BSP_NAME} › ${p.PRIMARY_NAME_2025} · HV feeder ${p.HV_FEEDER_NRN}</div>
        <table><tr><td>Network ref</td><td>${p.NRN_10_DIGIT}</td></tr>
        ${d ? `<tr><td>Peak load</td><td>${d.peak_kw} kW (${(d.peak_at || '').replace('T', ' ').slice(0, 16)})</td></tr>
        <tr><td>Smart meters</td><td>${d.meters}</td></tr><tr><td>Peak per meter</td><td>${d.meters ? (d.peak_kw / d.meters).toFixed(2) : '–'} kW</td></tr></table>
        <div style="margin-top:6px;font-weight:600">LV feeders</div><table>${d.feeders.map(x =>
          `<tr><td>${x.name || x.id.slice(-2)}</td><td>${x.peak_kw} kW peak · ${x.avg_kw} kW avg · ${x.meters} meters</td></tr>`).join('')}</table>`
        : '<tr><td>Smart meter</td><td>no data loaded for this substation</td></tr></table>'}</div>`, { maxWidth: 380 });
    }
  });
  secLayers = [layer.addTo(map)];
  if (fc.features.length) map.fitBounds(layer.getBounds(), { padding: [20, 20] });
  const vals = fc.features.map(f => smx[f.properties.NRN_10_DIGIT]).filter(Boolean);
  renderStats(null, [
    [fc.features.length, 'secondary areas'],
    [vals.length, 'with smart meter data'],
    [vals.reduce((a, d) => a + d.meters, 0), 'smart meters'],
    [vals.length ? Math.max(...vals.map(d => d.peak_kw)).toFixed(0) + ' kW' : '–', 'highest secondary peak'],
  ]);
  renderLegend(breaks, intensity ? 'kW/meter' : 'kW', !sm);
  fillSearch([]);
}

function renderStats(props, custom) {
  const el = document.getElementById('stats');
  if (custom) { el.innerHTML = custom.map(([v, s]) => `<div class="stat"><b>${v}</b><span>${s}</span></div>`).join(''); return; }
  // SSEN leaves some fields blank at some levels (e.g. numeric headroom at GSP), so say so instead of showing 0
  const sum = (k, u) => props.some(p => p[k] != null)
    ? props.reduce((a, p) => a + (+p[k] || 0), 0).toFixed(0) + ' ' + u : 'not published';
  const count = (k, v) => props.filter(p => p[k] === v).length;
  el.innerHTML = [
    [props.length, 'areas'],
    [`${count('Substation_Demand_RAG_Status', 'Red')}`, 'demand-constrained (red)'],
    [sum('Estimated_Demand_Headroom__MVA_', 'MVA'), 'total demand headroom'],
    [`${count('Substation_Generation_RAG_Status', 'Red')}`, 'generation-constrained (red)'],
    [sum('Estimated_Generation_Headroom__MW_', 'MW'), 'total gen headroom'],
    [sum('Contracted_Generation__MW_', 'MW'), 'contracted gen queue'],
  ].map(([v, s]) => `<div class="stat"><b>${v}</b><span>${s}</span></div>`).join('');
}

function renderLegend(smBreaks, smUnit, smMissing) {
  const el = document.getElementById('legend');
  if (state.level === 'secondary' || state.level === 'smart') {
    if (!smBreaks) { el.innerHTML = ''; return; }
    el.innerHTML = smMissing ? '<div class="note">No smart meter data loaded yet: areas shown grey.</div>'
      : `<div class="ramp" style="background:linear-gradient(90deg,${SM_RAMP.join(',')})"></div>
      <div class="ramp-l"><span>low</span><span>${smBreaks[1]}</span><span>${smBreaks[3]}+ ${smUnit}</span></div>
      <div class="note" style="margin-top:6px">Peak half-hour load from aggregated smart meters (higher = more stressed).</div>`;
    return;
  }
  if (state.metric.endsWith('RAG')) {
    el.innerHTML = `<div class="legend">${['Green', 'Amber', 'Red'].map(k =>
      `<div><span class="sw" style="background:${RAG[k]}"></span>${k === 'Green' ? 'Capacity available' : k === 'Amber' ? 'Limited capacity' : 'Constrained'}</div>`).join('')}</div>`;
  } else {
    const b = BREAKS[state.metric], u = state.metric === 'dHead' ? 'MVA' : 'MW';
    el.innerHTML = `<div class="ramp" style="background:linear-gradient(90deg,${RAMP.join(',')})"></div>
      <div class="ramp-l"><span>≤${b[0]}</span><span>${b[1]}</span><span>${b[2]}</span><span>${b[3]}+ ${u}</span></div>`;
  }
}

function renderCrumbs() {
  const el = document.getElementById('crumbs');
  const parts = [`<a data-crumb="-1">All SSEN</a>`].concat(state.trail.map((t, i) => `<a data-crumb="${i}">${t.name}</a>`));
  el.innerHTML = parts.join(' › ') + (state.trail.length ? '' : ' <span style="color:var(--muted)">(click an area, then “Show …”)</span>');
}

function fillSearch(names) {
  document.getElementById('names').innerHTML = [...new Set(names)].sort().map(n => `<option value="${n}">`).join('');
}

async function drill(id) {
  const cfg = LEVELS[state.level];
  const p = data[state.level].features.find(f => f.properties[cfg.id] === id).properties;
  state.trail.push({ level: state.level, id, name: cfg.name(p), filter: state.filter, nrn: p.PRIMARY_NRN_SPLIT });
  state.filter = cfg.childKey ? { key: cfg.childKey, value: id } : null;
  state.level = cfg.child;
  map.closePopup();
  render(true);
}

document.getElementById('map').addEventListener('click', e => {
  const b = e.target.closest('button[data-drill]'); if (b) drill(b.dataset.drill);
});
document.getElementById('crumbs').addEventListener('click', e => {
  const a = e.target.closest('a[data-crumb]'); if (!a) return;
  const i = +a.dataset.crumb;
  if (i < 0) { state.trail = []; state.filter = null; state.level = 'gsp'; }
  else {
    const t = state.trail[i]; state.trail = state.trail.slice(0, i + 1); state.level = LEVELS[t.level].child;
    state.filter = LEVELS[t.level].childKey ? { key: LEVELS[t.level].childKey, value: t.id } : null;
  }
  render(true);
});
document.getElementById('levels').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const lvl = b.dataset.level;
  if ((lvl === 'secondary' || lvl === 'smart') && currentPrimary()) { state.level = lvl; state.filter = null; return render(true); }
  state.level = lvl; state.filter = null; state.trail = []; render(true);
});
document.getElementById('metrics').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.metric = b.dataset.metric; render(false);
});
document.getElementById('q').addEventListener('change', e => {
  if (!areaLayer) return;
  const q = e.target.value.toLowerCase();
  areaLayer.eachLayer(l => {
    if (LEVELS[state.level].name(l.feature.properties).toLowerCase() === q) { map.fitBounds(l.getBounds()); l.openPopup(); }
  });
});
document.getElementById('showSubs').addEventListener('change', async e => {
  if (!e.target.checked) { subsLayer && map.removeLayer(subsLayer); return; }
  const fc = await load('substations', 'data/substations.geojson');
  const size = { GSP: 7, BSP: 5.5, Primary: 3.5 };
  subsLayer = L.geoJSON(fc, {
    pointToLayer: (f, ll) => L.circleMarker(ll, { radius: size[f.properties.Substation_Type] || 3, color: '#1b1f24', weight: 1, fillColor: colourFor(f.properties), fillOpacity: 1 }),
    onEachFeature: (f, l) => { l.bindPopup(popupHtml(f.properties, null)); l.bindTooltip(f.properties.Substation); }
  }).addTo(map);
});
document.getElementById('showLicence').addEventListener('change', async e => {
  if (!e.target.checked) { licenceLayer && map.removeLayer(licenceLayer); return; }
  const fc = await load('licence', 'data/licence_area.geojson');
  licenceLayer = L.geoJSON(fc, { style: { color: '#0b6bcb', weight: 1.5, fill: false, dashArray: '4 3' }, interactive: false }).addTo(map);
});

document.getElementById('showLicence').dispatchEvent(new Event('change'));
render(true);
</script>
</body>
</html>
