<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GB Grid Capacity Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5f6b7a; --line: #dfe3e8;
    --accent: #0b6bcb; --green: #2e9d5b; --amber: #e0a100; --red: #d64545; --grey: #9aa4b1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --panel: #1b2027; --ink: #e8ecf1; --muted: #9aa6b4; --line: #2c333d; --accent: #5aa7ff;
    }
  }
  :root[data-theme="dark"] { --bg: #12151a; --panel: #1b2027; --ink: #e8ecf1; --muted: #9aa6b4; --line: #2c333d; --accent: #5aa7ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  #map { height: 100%; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .group { margin-bottom: 16px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { flex: 1 1 auto; padding: 6px 8px; border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 6px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; }
  .sources { font-size: 11.5px; color: var(--muted); }
  .sources a { color: var(--accent); }
  input[type=search] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; }
  label.chk { display: flex; gap: 8px; align-items: center; margin: 4px 0; cursor: pointer; }
  .crumbs { font-size: 13px; }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .legend { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .ramp { height: 10px; border-radius: 4px; }
  .ramp-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; }
  .leaflet-popup-content { font-size: 12.5px; min-width: 260px; }
  .pop h3 { margin: 0 0 4px; font-size: 14px; }
  .pop table { border-collapse: collapse; width: 100%; }
  .pop td { padding: 2px 0; vertical-align: top; }
  .pop td:first-child { color: #5f6b7a; padding-right: 10px; white-space: nowrap; }
  .pop button { margin-top: 8px; padding: 5px 10px; border: 0; border-radius: 5px; background: #0b6bcb; color: #fff; cursor: pointer; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 9px; color: #fff; font-size: 11px; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>GB Grid Capacity Map</h1>
    <div class="sub">Electricity capacity, gas mains, water works and broadband build, and dig-once opportunities across Great Britain · from open data</div>

    <div class="group">
      <div class="label">Network operator</div>
      <select id="dno"><option value="all">All GB operators</option></select>
    </div>

    <div class="group">
      <div class="label">Network level</div>
      <div class="seg" id="levels">
        <button data-level="gsp">GSP</button>
        <button data-level="bsp">BSP</button>
        <button data-level="primary">Primary</button>
        <button data-level="secondary">Secondary</button>
        <button data-level="smart">Smart meter</button>
        <button data-level="gas">Gas mains</button>
        <button data-level="water">Water</button>
        <button data-level="telecoms">Telecoms</button>
        <button data-level="digonce">Dig once</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Colour by</div>
      <div class="seg" id="metrics">
        <button data-metric="dRAG">Demand RAG</button>
        <button data-metric="gRAG">Generation RAG</button>
        <button data-metric="dHead">Demand headroom</button>
        <button data-metric="gHead">Gen headroom</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Drill-down</div>
      <div class="crumbs" id="crumbs"></div>
    </div>

    <div class="group">
      <input type="search" id="q" placeholder="Find a substation…" list="names">
      <datalist id="names"></datalist>
    </div>

    <div class="group">
      <div class="label">Overlays</div>
      <label class="chk"><input type="checkbox" id="showLicence" checked> Licence areas</label>
      <label class="chk"><input type="checkbox" id="showLA"> Local authorities</label>
    </div>

    <div class="group">
      <div class="label">Show only data within</div>
      <select id="la"><option value="">Any local authority</option></select>
      <select id="lic" style="margin-top:6px"><option value="">Any licence area</option></select>
      <div class="sources" id="areaNote" style="margin-top:4px;display:none">Stats cover the whole selected area. <a href="#" id="areaClear">Clear</a></div>
    </div>

    <div class="group">
      <div class="label">Legend</div>
      <div id="legend"></div>
    </div>

    <div class="group">
      <div class="label" id="statsLabel">In view</div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="group note" id="levelNote"></div>
  </aside>
  <div id="map"></div>
</div>

<script>
const RAG = { Green: getCss('--green'), Amber: getCss('--amber'), Red: getCss('--red') };
function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

const LEVELS = {
  gsp:       { label: 'GSP', child: 'bsp', radius: 8 },
  bsp:       { label: 'BSP', child: 'primary', radius: 6 },
  primary:   { label: 'Primary', child: 'secondary', radius: 4.5 },
  secondary: { label: 'secondary area' },
};
const NOTES = {
  gsp: 'Grid Supply Points: where the transmission network feeds each operator. Not every operator publishes this level (NGED starts at BSP). Click a site to drill down.',
  bsp: 'Bulk Supply Points (132/33kV and 132/66kV). Areas where the operator publishes supply-area boundaries; dots where it publishes site locations only.',
  primary: 'Primary substations (33/11kV and 66/11kV). Headroom and RAG are each operator\'s own published estimates, so methods differ slightly between operators.',
  secondary: 'Every GB secondary substation (11kV/LV), coloured by utilisation where the operator publishes rating and demand. Dots when zoomed out; supply areas (or sites) from street level. UKPN gives bands; NPg redacts small sites; SPEN covers monitored transformers only; SSEN publishes no ratings.',
  digonce: 'Where street works could be coordinated (England, DfT Street Manager). Dots: streets where several utilities dug in the last 12 months, utility works are already planned, or a resurfacing restriction (Section 58) is coming; the more signals, the redder. From street zoom: Section 58 restrictions (orange: proposed, dig before it starts; grey: in force, no new works). Click a street for who dug, who plans to, and when. Pick a local authority or licence area under “Show only data within” to see only its streets and totals.',
  telecoms: 'Telecoms networks (ducts, poles, cables) aren\'t open data. Shown instead: where gigabit broadband is still missing (Ofcom, Jan 2026, by census output area), i.e. where fibre has yet to be dug in, and the postcodes in Project Gigabit\'s subsidised build contracts (purple; England and Wales). Click a dot for details.',
  water: 'Water companies don\'t publish their pipe networks (the national register of buried pipes, NUAR, is invitation-only, mainly for asset owners and local authorities). Shown instead: water company areas and every storm overflow in England, coloured by when improvement works (new storage, bigger sewers, so excavation) are planned under the National Storm Overflows Plan.',
  gas: 'Metallic gas mains (cast, spun and ductile iron, and steel): the pipes being replaced under the iron mains programme, so the likeliest to be dug up in the next few years. Thick lines are already in the gas network\'s replacement programme. Zoomed out: km of metallic main per ~10 km square. Cadent, SGN and Northern Gas Networks (~38,000 km). Only Cadent publishes a replacement programme, so SGN and NGN mains are never thick. Wales & West Utilities publishes no pipe data yet.',
  smart: 'Measured peak load from aggregated smart meters on two winter weekdays: SSEN, UKPN, NGED and NPg (~125k secondaries). Only substations with more than 5 smart meters are published.',
};

const state = { level: 'gsp', metric: 'dRAG', filter: null, trail: [], dno: 'all', la: null, lic: null, digMin: 2 };
const data = {};
const map = L.map('map', { preferCanvas: true }).setView([54.8, -3.2], 6);
const basemaps = {
  'Light grey': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Basemap &copy; Esri · Network data: GB DNO open data', maxNativeZoom: 16, maxZoom: 19 }),
  'Streets': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors · Network data: GB DNO open data', maxZoom: 19 }),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Imagery &copy; Esri · Network data: GB DNO open data', maxZoom: 19 }),
};
basemaps['Light grey'].addTo(map);
L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

let areaLayer = null, licenceLayer = null, secLayers = null, secCleanup = null, manifest = {};
let laLayer = null, areaShade = null;
// local authority outlines sit above every layer but never take clicks
map.createPane('la');
map.getPane('la').style.zIndex = 450;
map.getPane('la').style.pointerEvents = 'none';

const fmt = (v, u) => v == null || isNaN(v) ? '–' : `${(+v).toFixed(1)} ${u}`;
const metricVal = (p, m) => m === 'dHead' ? p.dhead : p.ghead;
const RAG_CODE = { G: 'Green', A: 'Amber', R: 'Red' };
const RAMP = ['#d64545', '#e8833a', '#e0c200', '#8cc152', '#2e9d5b'];
const BREAKS = { dHead: [0, 5, 15, 40], gHead: [0, 5, 15, 40] };

function colourFor(p) {
  const m = state.metric;
  if (m === 'dRAG') return RAG[RAG_CODE[p.drag]] || getCss('--grey');
  if (m === 'gRAG') return RAG[RAG_CODE[p.grag]] || getCss('--grey');
  const v = metricVal(p, m);
  if (v == null) return getCss('--grey');
  const b = BREAKS[m]; let i = 0; while (i < b.length && v > b[i]) i++;
  return RAMP[i];
}

// All operators' sites for a level, merged; plus how many children each site has (for the drill button)
const childCount = {};
async function loadLevel(lvl) {
  if (data['gb_' + lvl]) return data['gb_' + lvl];
  const dnos = Object.keys(manifest).filter(d => manifest[d].counts && manifest[d].counts[lvl]);
  const parts = await Promise.all(dnos.map(d => load(`gb_${d}_${lvl}`, `data/gb/${d}_${lvl}.geojson`)));
  const fc = { type: 'FeatureCollection', features: parts.filter(Boolean).flatMap(p => p.features) };
  if (lvl !== 'gsp') fc.features.forEach(f => { const pid = f.properties.pid; if (pid) childCount[pid] = (childCount[pid] || 0) + 1; });
  return (data['gb_' + lvl] = fc);
}

async function load(name, file) {
  if (data[name]) return data[name];
  const r = await fetch(file);
  if (!r.ok) return null;
  return (data[name] = await r.json());
}

function popupHtml(p) {
  const pill = c => c ? `<span class="pill" style="background:${RAG[RAG_CODE[c]]}">${RAG_CODE[c]}</span>` : '';
  const m = manifest[p.dno] || {};
  const rows = [
    ['Upstream', [p.gsp, p.bsp].filter(Boolean).join(' → ') || '–'],
    ['Firm capacity', fmt(p.dfirm, 'MVA')],
    ['Max demand', fmt(p.dmax, 'MVA')],
    ['Demand headroom', fmt(p.dhead, 'MVA') + ' ' + pill(p.drag)],
    ['Demand constraint', p.dlim || '–'],
    ['Gen headroom', fmt(p.ghead, 'MW') + ' ' + pill(p.grag)],
    ['Gen constraint', p.glim || '–'],
  ];
  const cfg = LEVELS[p.level];
  let btn = '';
  if (cfg.child === 'secondary') {
    btn = `<button data-drill="${p.id}">Show secondary substations →</button>`;
  } else if (childCount[p.id]) {
    btn = `<button data-drill="${p.id}">Show ${childCount[p.id]} sites below →</button>`;
  }
  return `<div class="pop"><h3>${p.name || '–'}</h3>
    <div style="color:#5f6b7a;margin-bottom:6px">${cfg.label} · ${m.title || p.dno}</div>
    <table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
    ${p.note ? `<div class="note" style="margin-top:6px">${p.note}</div>` : ''}
    <div class="sources" style="margin-top:6px">Source: <a href="${m.source || '#'}" target="_blank" rel="noopener">${p.dno} open data</a> (${m.licence || ''})</div>${btn}</div>`;
}

let renderToken = 0;  // a newer render() supersedes one still waiting on data

async function render(fit) {
  const token = ++renderToken;
  if (areaLayer) { map.removeLayer(areaLayer); areaLayer = null; }
  if (secLayers) { secLayers.forEach(l => map.removeLayer(l)); secLayers = null; }
  if (secCleanup) { secCleanup(); secCleanup = null; }
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', b.dataset.level === state.level));
  document.querySelectorAll('#metrics button').forEach(b => b.classList.toggle('on', b.dataset.metric === state.metric));
  // capacity metrics only exist for GSP/BSP/Primary; secondaries are coloured by smart meter load
  document.getElementById('metrics').parentElement.style.display = ['secondary', 'smart', 'gas', 'water', 'telecoms', 'digonce'].includes(state.level) ? 'none' : '';
  document.getElementById('levelNote').textContent = NOTES[state.level];
  document.getElementById('statsLabel').textContent = areaName() || 'In view';
  renderCrumbs();
  renderLegend();

  if (state.level === 'secondary' || state.level === 'smart') return renderSecondary(token);
  if (state.level === 'gas') return renderGas(token);
  if (state.level === 'water') return renderWater(token);
  if (state.level === 'telecoms') return renderTelecoms(token);
  if (state.level === 'digonce') return renderDigOnce(token);

  const cfg = LEVELS[state.level];
  await Promise.all(['gsp', 'bsp', 'primary'].map(loadLevel));  // child counts need every level
  if (token !== renderToken) return;
  const fc = await loadLevel(state.level);
  const feats = fc.features.filter(f => (!state.filter || f.properties.pid === state.filter)
                                     && (state.dno === 'all' || f.properties.dno === state.dno) && featInArea(f));
  // an operator that doesn't publish this level (NGED has no GSP tier): show its top level instead
  if (!feats.length && !state.filter && state.level === 'gsp' && !areaSel().length) { state.level = 'bsp'; return render(fit); }
  areaLayer = L.geoJSON({ type: 'FeatureCollection', features: feats }, {
    style: f => f.geometry.type === 'Point'
      ? { color: '#ffffff', weight: 1, fillColor: colourFor(f.properties), fillOpacity: 0.95 }
      : { color: '#ffffff', weight: 0.8, fillColor: colourFor(f.properties), fillOpacity: 0.62 },
    pointToLayer: (f, ll) => L.circleMarker(ll, { radius: cfg.radius }),
    onEachFeature: (f, layer) => {
      layer.bindPopup(() => popupHtml(f.properties), { maxWidth: 360 });
      layer.bindTooltip(`${f.properties.name} (${f.properties.dno})`, { sticky: true });
      layer.on('mouseover', () => layer.setStyle({ weight: 2.5, color: '#1b1f24' }));
      layer.on('mouseout', () => areaLayer && areaLayer.resetStyle(layer));
    }
  }).addTo(map);
  if (fit && feats.length && !areaSel().length) map.fitBounds(areaLayer.getBounds(), { padding: [20, 20] });
  renderStats(feats.map(f => f.properties));
  fillSearch(feats.map(f => f.properties.name));
}

const currentPrimary = () => [...state.trail].reverse().find(t => t.level === 'primary');

const SM_RAMP = ['#2e9d5b', '#8cc152', '#e0c200', '#e8833a', '#d64545'];  // low → high load
function smColour(v, breaks) {
  if (v == null) return getCss('--grey');
  let i = 0; while (i < breaks.length && v > breaks[i]) i++;
  return SM_RAMP[i];
}

const SEC_POLY_ZOOM = 13;   // below this, secondaries are drawn as dots
const SEC_MAX_CELLS = 80;   // cap on ~10 km detail cells loaded for one view
const CELL_LON = 0.15, CELL_LAT = 0.1;  // must match build_gb_secondary.py
// point arrays are [lon, lat, util%|-1, smart meter peak kW|-1, operator index]
const SEC_SCALE = {
  secondary: { idx: 2, prop: 'util', breaks: [60, 80, 100, 120], unit: '%',
               label: 'Peak demand as a share of transformer rating (utilisation), as each operator publishes it. Busier sites are drawn on top when zoomed out. Grey: no rating or demand published.' },
  smart:     { idx: 3, prop: 'peak_kw', breaks: [25, 50, 85, 150], unit: 'kW',
               label: 'Peak half-hour load from aggregated smart meters on two winter Wednesdays (14 and 21 Jan 2026; NPg: 15 and 22 Jan 2025, its latest winter). ENWL publishes no consumption data and SPEN only summer pilots, so they are not shown.' },
};

// Canvas dot layer: GB has ~475k secondaries, far too many for individual Leaflet markers.
const DotLayer = L.Layer.extend({
  initialize(points, colourOf, opts) { this._pts = points; this._colourOf = colourOf; this._opts = opts || {}; },
  onAdd(map) {
    this._map = map;
    this._canvas = L.DomUtil.create('canvas', 'leaflet-zoom-hide');
    map.getPanes().overlayPane.appendChild(this._canvas);
    map.on('moveend resize', this._redraw, this);
    this._redraw();
  },
  onRemove(map) { L.DomUtil.remove(this._canvas); map.off('moveend resize', this._redraw, this); },
  // dot radius in pixels: grows with zoom (up to 9 px at street level) so dots stay easy to click
  radius() {
    const z = this._map.getZoom();
    return (this._opts.scale || 1) * (z < 7 ? 0.9 : z < 9 ? 1.4 : z < 11 ? 2.2 : Math.min(9, 3.2 + (z - 11) * 1.2));
  },
  // squared click tolerance: the dot itself plus a few pixels
  hitRadius2() { return Math.max(64, (this.radius() + 4) ** 2); },
  _redraw() {
    const map = this._map, size = map.getSize(), c = this._canvas, dpr = window.devicePixelRatio || 1;
    c.width = size.x * dpr; c.height = size.y * dpr; c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
    L.DomUtil.setPosition(c, map.containerPointToLayerPoint([0, 0]));
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    const b = map.getBounds().pad(0.05), r = this.radius();
    const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
    const grey = [], byColour = {};
    for (const p of this._pts) {
      if (p[0] < w || p[0] > e || p[1] < s || p[1] > n) continue;
      const col = this._colourOf(p);
      (col ? (byColour[col] ||= []) : grey).push(map.latLngToContainerPoint([p[1], p[0]]));
    }
    const draw = (pts, fill, alpha) => {
      ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.beginPath();
      for (const q of pts) { ctx.moveTo(q.x + r, q.y); ctx.arc(q.x, q.y, r, 0, 6.2832); }
      ctx.fill();
    };
    draw(grey, getCss('--grey'), 0.3);                         // no data underneath
    // ramp colours low → high so hot spots sit on top; any other colour (e.g. a single-colour layer) after them
    Object.keys(byColour).sort((a, b) => (SM_RAMP.indexOf(a) + 1 || 99) - (SM_RAMP.indexOf(b) + 1 || 99))
      .forEach(col => draw(byColour[col], col, this._opts.alpha || 0.9));
  },
});

function secondaryPopup(p) {
  const m = manifest[p.dno] || {};
  const v = (x, u) => x == null || x === '' ? '–' : (typeof x === 'number' ? `${x.toLocaleString()}${u || ''}` : x);
  const rows = [
    ['Utilisation', p.util != null ? `${Math.round(p.util)}%${p.uband ? ` (${p.uband})` : ''}` : '–'],
    ['Transformer rating', v(p.rating, ' kVA')],
    ['Peak demand', v(p.md, ' kVA')],
    ['Demand headroom', v(p.headroom, ' kVA')],
    ['Customers', v(p.cust)],
    ['Primary', v(p.primary)],
  ];
  if (p.gen_headroom != null) rows.push(['Generation headroom', v(p.gen_headroom, ' kVA')]);
  if (p.reinf) rows.push(['Predicted reinforcement', p.reinf]);
  if (p.lct != null) rows.push(['Low-carbon tech connected', v(p.lct)]);
  if (p.gen_kw != null) rows.push(['Generation connected', v(p.gen_kw, ' kW')]);
  if (p.peak_kw != null) rows.push(['Smart meter peak', `${p.peak_kw} kW from ${p.meters} meters${p.peak_at ? ` at ${p.peak_at} UTC` : ''}`]);
  if (p.peak_days) rows.push(['Smart meter days', p.peak_days]);
  if (p.month) rows.push(['Highest month', p.month]);
  const note = p.note ? `${p.note}.` : p.dno === 'SSEN' ? 'SSEN publishes no transformer ratings, so there is no utilisation; switch to Smart meter for measured load.' : '';
  return `<div class="pop"><h3>${p.name || 'Secondary ' + p.id}</h3>
    <div style="color:#5f6b7a;margin-bottom:6px">Secondary substation${p.kind ? ' · ' + p.kind : ''} · ${m.title || p.dno} · ref ${p.id}</div>
    <table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
    ${note ? `<div class="note" style="margin-top:6px">${note}</div>` : ''}
    <div class="sources" style="margin-top:6px">Source: <a href="${m.source || '#'}" target="_blank" rel="noopener">${p.dno} open data</a></div></div>`;
}

const secCellCache = {};
const secCell = (dno, key) => secCellCache[dno + key] ||= fetch(`data/gb/sec/${dno}/${key}.geojson`).then(r => r.ok ? r.json() : null);
const cellKey = (lon, lat) => `${Math.floor(lon / CELL_LON)}_${Math.floor(lat / CELL_LAT)}`;

async function renderSecondary(token) {
  const scale = SEC_SCALE[state.level];
  const index = await load('sec_index', 'data/gb/sec/index.json').catch(() => null);
  if (!index) { renderStats(null, [['–', 'secondary data not built yet']]); return; }
  const dnos = Object.keys(index).filter(d => (state.dno === 'all' || d === state.dno)
                                           && (state.level !== 'smart' || index[d].smart > 0));
  const parts = await Promise.all(dnos.map(d => load('sec_pts_' + d, `data/gb/sec/points_${d}.json`)));
  if (token !== renderToken) return;
  const pts = [];
  parts.forEach((arr, i) => (arr || []).forEach(p => inArea(p[0], p[1]) && pts.push([p[0], p[1], p[2], p[3], i])));
  const cellSets = dnos.map(d => new Set(index[d].cells));
  const colourOf = p => p[scale.idx] >= 0 ? smColour(p[scale.idx], scale.breaks) : null;
  const colourProps = pr => pr[scale.prop] != null ? smColour(pr[scale.prop], scale.breaks) : null;
  renderLegend(scale.breaks, scale.unit, scale.label);
  fillSearch([]);

  const prim = currentPrimary();  // drilled in from a primary: start zoomed to it
  if (prim && prim.bounds) map.fitBounds(prim.bounds, { padding: [20, 20], maxZoom: 15 });

  const dots = new DotLayer(pts, colourOf);
  const polys = L.layerGroup();
  let shown = '';
  const toLayer = fc => L.geoJSON(fc, {
    filter: featInArea,
    style: f => f.geometry.type === 'Point'
      ? { color: '#ffffff', weight: 1, fillColor: colourProps(f.properties) || getCss('--grey'), fillOpacity: colourProps(f.properties) ? 0.95 : 0.5 }
      : { color: '#ffffff', weight: 0.6, fillColor: colourProps(f.properties) || getCss('--grey'), fillOpacity: colourProps(f.properties) ? 0.7 : 0.3 },
    pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 5 }),
    onEachFeature: (f, l) => {
      l.bindTooltip(`${f.properties.name || 'Secondary ' + f.properties.id} (${f.properties.dno})`, { sticky: true });
      l.bindPopup(() => secondaryPopup(f.properties), { maxWidth: 380 });
    },
  });

  const update = async () => {
    const b = map.getBounds();
    const inView = areaSel().length ? pts : pts.filter(p => b.contains([p[1], p[0]]));
    const withV = inView.filter(p => p[scale.idx] >= 0);
    renderStats(null, [
      [inView.length.toLocaleString(), areaSel().length ? 'secondaries' : 'secondaries in view'],
      [`${withV.length.toLocaleString()} (${inView.length ? Math.round(100 * withV.length / inView.length) : 0}%)`,
       state.level === 'smart' ? 'with smart meter data' : 'with utilisation'],
      state.level === 'smart'
        ? [withV.length ? withV.reduce((m, p) => Math.max(m, p[3]), 0) + ' kW' : '–', 'highest secondary peak']  // no spread: 100k+ args overflow
        : [withV.filter(p => p[2] > 100).length.toLocaleString(), 'over 100% utilised'],
      [new Set(inView.map(p => p[4])).size, areaSel().length ? 'operators' : 'operators in view'],
    ]);
    const keys = [];
    if (map.getZoom() >= SEC_POLY_ZOOM) {
      for (let x = Math.floor(b.getWest() / CELL_LON); x <= Math.floor(b.getEast() / CELL_LON); x++)
        for (let y = Math.floor(b.getSouth() / CELL_LAT); y <= Math.floor(b.getNorth() / CELL_LAT); y++) keys.push(`${x}_${y}`);
    }
    if (!keys.length || keys.length > SEC_MAX_CELLS) {
      if (!map.hasLayer(dots)) { polys.clearLayers(); shown = ''; map.removeLayer(polys); dots.addTo(map); }
      return;
    }
    const wanted = dnos.flatMap((d, i) => keys.filter(k => cellSets[i].has(k)).map(k => [d, k]));
    const sig = wanted.map(w => w.join('/')).join('|');
    if (sig === shown) return;
    shown = sig;
    const fcs = await Promise.all(wanted.map(([d, k]) => secCell(d, k)));
    if (shown !== sig) return;  // view moved on while loading
    polys.clearLayers();
    fcs.filter(Boolean).forEach(fc => polys.addLayer(toLayer(fc)));
    if (map.hasLayer(dots)) map.removeLayer(dots);
    polys.addTo(map);
  };

  // clicking a dot: nearest secondary within a few pixels, details from its detail cell
  const onClick = async e => {
    if (!map.hasLayer(dots)) return;
    const c = map.latLngToContainerPoint(e.latlng);
    let best = null, bestD = dots.hitRadius2();
    for (const p of pts) {
      if (Math.abs(p[1] - e.latlng.lat) > 0.2 || Math.abs(p[0] - e.latlng.lng) > 0.3) continue;
      const q = map.latLngToContainerPoint([p[1], p[0]]), dd = (q.x - c.x) ** 2 + (q.y - c.y) ** 2;
      if (dd < bestD) { bestD = dd; best = p; }
    }
    if (!best) return;
    const fc = await secCell(dnos[best[4]], cellKey(best[0], best[1]));
    if (!fc) return;
    const near = f => {  // the feature at this dot: exact point, or the area whose box contains it
      const g = L.geoJSON(f);
      if (f.geometry.type === 'Point') return L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]).distanceTo([best[1], best[0]]);
      const bb = g.getBounds();
      return bb.contains([best[1], best[0]]) ? bb.getCenter().distanceTo([best[1], best[0]]) : Infinity;
    };
    const feat = fc.features.reduce((a, f) => (near(f) < near(a) ? f : a), fc.features[0]);
    L.popup({ maxWidth: 380 }).setLatLng([best[1], best[0]]).setContent(secondaryPopup(feat.properties)).openOn(map);
  };

  dots.addTo(map);
  map.on('moveend', update);
  map.on('click', onClick);
  secCleanup = () => { map.off('moveend', update); map.off('click', onClick); map.removeLayer(dots); map.removeLayer(polys); };
  update();
}

async function renderGas(token) {
  const [index, grid, areas] = await Promise.all([
    load('gas_index', 'data/gb/gas/index.json').catch(() => null),
    load('gas_grid', 'data/gb/gas/grid.json').catch(() => null),
    load('gas_areas', 'data/gb/gas/areas.geojson').catch(() => null)]);
  if (token !== renderToken) return;
  if (!index || !grid) { renderStats(null, [['–', 'gas data not built yet']]); return; }
  renderLegend(); fillSearch([]);
  const gdns = Object.keys(index), cellSets = gdns.map(g => new Set(index[g].cells));
  const maxKm = Object.values(grid).reduce((m, v) => Math.max(m, v[0]), 0);
  const squares = L.layerGroup(Object.entries(grid).map(([k, v]) => {
    const [x, y] = k.split('_').map(Number);
    const t = Math.sqrt(v[0] / maxKm);
    return L.rectangle([[y * CELL_LAT, x * CELL_LON], [(y + 1) * CELL_LAT, (x + 1) * CELL_LON]],
      { stroke: false, fillColor: '#c0392b', fillOpacity: 0.12 + 0.68 * t })
      .bindTooltip(`${Math.round(v[0])} km metallic main · ${Math.round(v[1])} km in replacement programme (${v[2]})`, { sticky: true });
  }).filter((sq, i) => cellInArea(Object.keys(grid)[i])));
  const outline = areas ? L.geoJSON(areas, { style: { color: '#c0392b', weight: 1.2, fill: false, dashArray: '2 4' }, interactive: false }) : null;
  const pipes = L.layerGroup();
  let shown = '';
  const toLayer = fc => L.geoJSON(fc, {
    filter: featInArea,
    style: f => ({ color: (GAS_MAT[f.properties.mat] || { c: '#888' }).c, weight: f.properties.mrp ? 5 : 2.2, opacity: 0.9 }),
    onEachFeature: (f, l) => l.bindPopup(() => gasPopup(f.properties), { maxWidth: 340 }),
  });
  const update = async () => {
    const b = map.getBounds();
    let km = 0, kmMrp = 0, n = 0;
    for (const [k, v] of Object.entries(grid)) {
      const [x, y] = k.split('_').map(Number);
      if (areaSel().length ? !cellInArea(k)
          : (x + 1) * CELL_LON < b.getWest() || x * CELL_LON > b.getEast() || (y + 1) * CELL_LAT < b.getSouth() || y * CELL_LAT > b.getNorth()) continue;
      km += v[0]; kmMrp += v[1]; n++;
    }
    renderStats(null, [
      [Math.round(km).toLocaleString() + ' km', areaSel().length ? 'metallic gas main (~10 km squares touching the area)' : 'metallic gas main in view'],
      [Math.round(kmMrp).toLocaleString() + ' km', `in replacement programme (${km ? Math.round(100 * kmMrp / km) : 0}%)`],
      [n, '~10 km squares'], [gdns.filter((g, i) => !areaSel().length || index[g].cells.some(cellInArea)).join(', ') || '–', 'gas networks'],
    ]);
    const keys = [];
    if (map.getZoom() >= GAS_POLY_ZOOM)
      for (let x = Math.floor(b.getWest() / CELL_LON); x <= Math.floor(b.getEast() / CELL_LON); x++)
        for (let y = Math.floor(b.getSouth() / CELL_LAT); y <= Math.floor(b.getNorth() / CELL_LAT); y++) keys.push(`${x}_${y}`);
    if (!keys.length || keys.length > 40) {
      if (!map.hasLayer(squares)) { pipes.clearLayers(); shown = ''; map.removeLayer(pipes); squares.addTo(map); }
      return;
    }
    const wanted = gdns.flatMap((g, i) => keys.filter(k => cellSets[i].has(k)).map(k => [g, k]));
    const sig = wanted.map(w => w.join('/')).join('|');
    if (sig === shown) return;
    shown = sig;
    const fcs = await Promise.all(wanted.map(([g, k]) => gasCell(g, k)));
    if (shown !== sig) return;
    pipes.clearLayers();
    fcs.filter(Boolean).forEach(fc => pipes.addLayer(toLayer(fc)));
    if (map.hasLayer(squares)) map.removeLayer(squares);
    pipes.addTo(map);
  };
  squares.addTo(map);
  if (outline) outline.addTo(map);
  map.on('moveend', update);
  secCleanup = () => { map.off('moveend', update); map.removeLayer(squares); map.removeLayer(pipes); if (outline) map.removeLayer(outline); };
  update();
}

const GIG_PURPLE = '#7b2cbf';
const GIG_BREAKS = [0, 10, 25, 50];  // % of premises without gigabit

async function renderTelecoms(token) {
  let [oa, gig] = await Promise.all([
    load('tel_oa', 'data/gb/telecoms/oa.json').catch(() => null),
    load('tel_gig', 'data/gb/telecoms/gigabit.json').catch(() => null)]);
  if (token !== renderToken) return;
  if (!oa) { renderStats(null, [['–', 'telecoms data not built yet']]); return; }
  renderLegend(); fillSearch([]);
  if (areaSel().length) { oa = oa.filter(p => inArea(p[0], p[1])); if (gig) gig = { ...gig, postcodes: gig.postcodes.filter(p => inArea(p[0], p[1])) }; }
  const oaDots = new DotLayer(oa, p => p[2] < 0 ? null : p[2] <= GIG_BREAKS[0] ? SM_RAMP[0] : smColour(p[2], GIG_BREAKS));
  const gpc = gig ? gig.postcodes : [];
  const gigDots = new DotLayer(gpc, () => GIG_PURPLE, { scale: 0.7, alpha: 0.5 });
  const update = () => {
    const b = map.getBounds(), inB = p => areaSel().length || b.contains([p[1], p[0]]);
    let prem = 0, without = 0, inContract = 0, deferred = 0;
    for (const p of oa) if (inB(p)) { prem += p[4]; without += p[3]; }
    const pcs = gpc.filter(inB);
    for (const p of pcs) { inContract += p[2]; deferred += p[3]; }
    renderStats(null, [
      [without.toLocaleString(), `premises without gigabit (${prem ? Math.round(100 * without / prem) : 0}%)`],
      [prem.toLocaleString(), areaSel().length ? 'premises' : 'premises in view'],
      [inContract.toLocaleString(), 'premises in Project Gigabit contracts'],
      [new Set(pcs.map(p => p[6])).size, 'Project Gigabit contracts'],
    ]);
  };
  const onClick = e => {
    const c = map.latLngToContainerPoint(e.latlng);
    const nearest = arr => {
      let best = null, bd = (arr === gpc ? gigDots : oaDots).hitRadius2();
      for (const p of arr) {
        if (Math.abs(p[1] - e.latlng.lat) > 0.2 || Math.abs(p[0] - e.latlng.lng) > 0.3) continue;
        const q = map.latLngToContainerPoint([p[1], p[0]]), d = (q.x - c.x) ** 2 + (q.y - c.y) ** 2;
        if (d < bd) { bd = d; best = p; }
      }
      return best;
    };
    const g = map.hasLayer(gigDots) ? nearest(gpc) : null, o = g ? null : nearest(oa);
    if (g) {
      L.popup({ maxWidth: 340 }).setLatLng([g[1], g[0]]).setContent(`<div class="pop"><h3>Project Gigabit · ${g[7]}</h3>
        <table><tr><td>Premises in contract</td><td>${g[2]}${g[3] ? ` (${g[3]} deferred)` : ''}</td></tr>
        <tr><td>Contract</td><td>${gig.contracts[g[6]] || '–'}</td></tr>
        <tr><td>Supplier</td><td>${gig.suppliers[g[5]] || '–'}</td></tr>
        <tr><td>Final coverage date</td><td>${g[4] > 0 ? g[4] : '–'}</td></tr></table>
        <div class="sources" style="margin-top:6px">Source: <a href="https://www.gov.uk/government/publications/premises-in-bduk-plans-england-and-wales" target="_blank" rel="noopener">Premises in BDUK plans</a> (May 2026)</div></div>`).openOn(map);
    } else if (o) {
      L.popup({ maxWidth: 320 }).setLatLng([o[1], o[0]]).setContent(`<div class="pop"><h3>Census output area</h3>
        <table><tr><td>Premises</td><td>${o[4]}</td></tr>
        <tr><td>Without gigabit</td><td>${o[3]} (${o[2] < 0 ? '–' : o[2] + '%'})</td></tr></table>
        <div class="sources" style="margin-top:6px">Source: <a href="https://www.ofcom.org.uk/phones-and-broadband/coverage-and-speeds/connected-nations-update-spring-2026" target="_blank" rel="noopener">Ofcom Connected Nations</a>, Jan 2026</div></div>`).openOn(map);
    }
  };
  oaDots.addTo(map); gigDots.addTo(map);
  document.getElementById('showGig').addEventListener('change', e => e.target.checked ? gigDots.addTo(map) : map.removeLayer(gigDots));
  map.on('moveend', update); map.on('click', onClick);
  secCleanup = () => { map.off('moveend', update); map.off('click', onClick); map.removeLayer(oaDots); map.removeLayer(gigDots); };
  update();
}

  const s58Feats = s58 ? s58.features.filter(featInArea) : [];
  const digCell = key => (data['dig_cell_' + key] ||= fetch(`data/gb/digonce/cells/${key}.json`).then(r => r.ok ? r.json() : []));
  const dots = new DotLayer(rows, r => smColour(r[2], DIG_BREAKS));
  const restrictions = L.layerGroup();
  let restrictionsShown = false;
  // bounding box per restriction, so only those in view are drawn
  const s58Boxes = s58Feats.map(f => L.geoJSON(f).getBounds());
  const s58Layer = s58 ? L.geoJSON(null, {
    style: f => ({ color: S58_COL[f.properties.status], weight: f.properties.status === 'proposed' ? 5 : 3.5, opacity: 0.85,
                   fillOpacity: 0.25, dashArray: f.properties.status === 'proposed' ? '6 4' : null }),
    onEachFeature: (f, l) => l.bindPopup(() => { const p = f.properties; return `<div class="pop"><h3>${p.street || 'Section 58 restriction'}</h3>
      <div style="color:#5f6b7a;margin-bottom:6px">${[p.town, p.ha].filter(Boolean).join(' · ')}</div>
      <table><tr><td>Status</td><td>${p.status === 'proposed' ? '<b>Proposed</b>: utilities should dig before it starts' : 'In force: no new street works'}</td></tr>
      <tr><td>Restriction</td><td>${p.start || '?'} to ${p.end || '?'} (${p.duration})</td></tr>
      <tr><td>Extent</td><td>${p.extent || '–'}</td></tr><tr><td>Notice</td><td>${p.ref}</td></tr></table>
      <div class="sources" style="margin-top:6px">Section 58, New Roads and Street Works Act 1991 · DfT Street Manager</div></div>`; }, { maxWidth: 360 }),
  }) : null;
  const update = () => {
    // with a local authority selected, the stats cover the whole authority rather than the view
    const b = map.getBounds(), inView = la ? rows : rows.filter(r => b.contains([r[1], r[0]]));
    const s58In = s58Feats.filter((f, i) => la || b.intersects(s58Boxes[i]));
    if (la && !allRows.length && !s58In.length) renderStats(null, [['–', 'no dig-once data here (it covers England only)']]);
    else renderStats(null, [
      [inView.length.toLocaleString(), 'streets with a dig-once signal'],
      [inView.filter(r => r[3] & 1).length.toLocaleString(), 'dug by 3+ utilities in a year'],
      [inView.filter(r => r[3] & 2).length.toLocaleString(), 'with utility works planned'],
      [s58In.filter(f => f.properties.status === 'proposed').length.toLocaleString(), 'resurfacing restrictions proposed'],
    ]);
    const want = map.getZoom() >= 13 && s58Layer;
    if (want) {
      s58Layer.clearLayers(); s58Layer.addData(s58Feats.filter((f, i) => b.intersects(s58Boxes[i])));
      if (!restrictionsShown) { restrictions.addLayer(s58Layer); restrictions.addTo(map); restrictionsShown = true; }
    } else if (restrictionsShown) { map.removeLayer(restrictions); restrictions.clearLayers(); restrictionsShown = false; }
  };
  const onClick = async e => {
    const c = map.latLngToContainerPoint(e.latlng);
    let best = null, bd = dots.hitRadius2();
    for (const r of rows) {
      if (Math.abs(r[1] - e.latlng.lat) > 0.2 || Math.abs(r[0] - e.latlng.lng) > 0.3) continue;
      const q = map.latLngToContainerPoint([r[1], r[0]]), d = (q.x - c.x) ** 2 + (q.y - c.y) ** 2;
      if (d < bd) { bd = d; best = r; }
    }
    if (!best) return;
    const cell = await digCell(cellKey(best[0], best[1]));
    const row = cell.find(r => r[0] === best[0] && r[1] === best[1]);
    if (row) L.popup({ maxWidth: 380 }).setLatLng([best[1], best[0]]).setContent(digPopup(row, sectors)).openOn(map);
  };
  // legend slider: hide streets below a minimum score (bands match the dot colours)
  const slider = document.getElementById('digMin'), sliderLabel = document.getElementById('digMinLabel');
  const band = v => v <= 2 ? 'every signal' : v <= 4 ? 'a few signals or more' : v <= 6 ? 'several signals or more'
                  : v <= 9 ? 'many signals or more' : 'strong cases';
  const setMin = () => {
    state.digMin = +slider.value;
    rows = allRows.filter(r => r[2] >= state.digMin);
    dots._pts = rows;
    if (map.hasLayer(dots)) dots._redraw();
    sliderLabel.textContent = `Score ${state.digMin}+ (${band(state.digMin)}): ${rows.length.toLocaleString()} streets`;
    update();
  };
  slider.addEventListener('input', setMin);
  setMin();
  dots.addTo(map);
  map.on('moveend', update); map.on('click', onClick);
  secCleanup = () => { map.off('moveend', update); map.off('click', onClick); map.removeLayer(dots); map.removeLayer(restrictions); };
  update();
}

function renderStats(props, custom) {
  const el = document.getElementById('stats');
  if (custom) { el.innerHTML = custom.map(([v, s]) => `<div class="stat"><b>${v}</b><span>${s}</span></div>`).join(''); return; }
  // SSEN leaves some fields blank at some levels (e.g. numeric headroom at GSP), so say so instead of showing 0
  const sum = (k, u) => props.some(p => p[k] != null)
    ? Math.round(props.reduce((a, p) => a + Math.max(0, +p[k] || 0), 0)).toLocaleString() + ' ' + u : 'not published';
  const count = (k, v) => props.filter(p => p[k] === v).length;
  const ops = [...new Set(props.map(p => p.dno))];
  el.innerHTML = [
    [props.length.toLocaleString(), 'sites'],
    [ops.length, ops.length === 1 ? 'operator' : 'operators'],
    [count('drag', 'R').toLocaleString(), 'demand-constrained (red)'],
    [sum('dhead', 'MVA'), 'total demand headroom'],
    [count('grag', 'R').toLocaleString(), 'generation-constrained (red)'],
    [sum('ghead', 'MW'), 'total gen headroom'],
  ].map(([v, s]) => `<div class="stat"><b>${v}</b><span>${s}</span></div>`).join('');
}

function renderLegend(smBreaks, smUnit, smLabel) {
  const el = document.getElementById('legend');
  if (state.level === 'digonce') {
    el.innerHTML = `<div class="ramp" style="background:linear-gradient(90deg,${SM_RAMP.join(',')})"></div>
      <div class="ramp-l"><span>one signal</span><span>several</span><span>strong case</span></div>
      <input type="range" id="digMin" min="2" max="13" step="1" value="${state.digMin}" aria-label="Minimum dig-once score"
        style="width:100%;margin:6px 0 0;accent-color:var(--accent)">
      <div class="sources" id="digMinLabel"></div>
      <div class="legend" style="margin-top:6px">
        <div><span class="sw" style="background:${S58_COL.proposed}"></span>Resurfacing restriction proposed: dig before it starts</div>
        <div><span class="sw" style="background:${S58_COL.in_force}"></span>Restriction in force: no new works</div></div>
      <div class="note" style="margin-top:6px">Score = utilities that dug the street in the last year + 2 × utilities with works planned + 3 if a restriction is proposed + nearby signals from the other layers (gas mains due for replacement, storm overflow works by 2030, overloaded secondary substations, missing gigabit or Project Gigabit build).</div>`;
    return;
  }
  if (state.level === 'telecoms') {
    el.innerHTML = `<div class="ramp" style="background:linear-gradient(90deg,${SM_RAMP.join(',')})"></div>
      <div class="ramp-l"><span>all gigabit</span><span>25%</span><span>50%+ without</span></div>
      <label class="chk" style="margin-top:6px"><input type="checkbox" id="showGig" checked><span class="sw" style="background:${GIG_PURPLE}"></span>Project Gigabit build contracted</label>
      <div class="note" style="margin-top:6px">Dots: census output areas, coloured by share of premises without gigabit-capable broadband.</div>`;
    return;
  }
  if (state.level === 'water') {
    el.innerHTML = `<div class="legend">${WATER_BANDS.map(b => `<div><span class="sw" style="background:${b.c}"></span>${b.n}</div>`).join('')}</div>
      <div class="note" style="margin-top:6px">Storm overflow improvement works planned (National Storm Overflows Plan). Outlines: water company areas.</div>`;
    return;
  }
  if (state.level === 'gas') {
    el.innerHTML = `<div class="legend">${Object.entries(GAS_MAT).map(([k, m]) =>
      `<div><span class="sw" style="background:${m.c}"></span>${m.n}</div>`).join('')}
      <div><span class="sw" style="background:transparent;border:3px solid var(--ink);height:8px"></span>Thick: in replacement programme</div></div>
      <div class="note" style="margin-top:6px">Zoomed out, squares show km of metallic main (darker = more).</div>`;
    return;
  }
  if (state.level === 'secondary' || state.level === 'smart') {
    if (!smBreaks) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="ramp" style="background:linear-gradient(90deg,${SM_RAMP.join(',')})"></div>
      <div class="ramp-l"><span>&lt;${smBreaks[0]}</span><span>${smBreaks[1]}</span><span>${smBreaks[2]}</span><span>${smBreaks[3]}+ ${smUnit}</span></div>
      <div class="note" style="margin-top:6px">${smLabel}</div>`;
    return;
  }
  if (state.metric.endsWith('RAG')) {
    el.innerHTML = `<div class="legend">${['Green', 'Amber', 'Red'].map(k =>
      `<div><span class="sw" style="background:${RAG[k]}"></span>${k === 'Green' ? 'Capacity available' : k === 'Amber' ? 'Limited capacity' : 'Constrained'}</div>`).join('')}</div>`;
  } else {
    const b = BREAKS[state.metric], u = state.metric === 'dHead' ? 'MVA' : 'MW';
    el.innerHTML = `<div class="ramp" style="background:linear-gradient(90deg,${RAMP.join(',')})"></div>
      <div class="ramp-l"><span>≤${b[0]}</span><span>${b[1]}</span><span>${b[2]}</span><span>${b[3]}+ ${u}</span></div>`;
  }
}

function renderCrumbs() {
  const el = document.getElementById('crumbs');
  const parts = [`<a data-crumb="-1">All GB</a>`].concat(state.trail.map((t, i) => `<a data-crumb="${i}">${t.name}</a>`));
  el.innerHTML = parts.join(' › ') + (state.trail.length ? '' : ' <span style="color:var(--muted)">(click an area, then “Show …”)</span>');
}

function fillSearch(names) {
  document.getElementById('names').innerHTML = [...new Set(names)].sort().map(n => `<option value="${n}">`).join('');
}

async function drill(id) {
  const p = (await loadLevel(state.level)).features.find(f => f.properties.id === id).properties;
  let child = LEVELS[state.level].child;
  // some GSPs feed primaries directly (no BSP tier), e.g. much of northern Scotland
  if (child === 'bsp' && !(await loadLevel('bsp')).features.some(f => f.properties.pid === id)) child = 'primary';
  let bounds = null;
  if (child === 'secondary') {
    const f = (await loadLevel(state.level)).features.find(x => x.properties.id === id);
    bounds = f.geometry.type === 'Point' ? L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]).toBounds(4000)
                                         : L.geoJSON(f).getBounds();
  }
  state.trail.push({ level: state.level, id, name: p.name, child, nrn: p.nrn, bounds });
  state.filter = child === 'secondary' ? null : id;
  state.level = child;
  map.closePopup();
  render(true);
}

document.getElementById('map').addEventListener('click', e => {
  const b = e.target.closest('button[data-drill]'); if (b) drill(b.dataset.drill);
});
document.getElementById('crumbs').addEventListener('click', e => {
  const a = e.target.closest('a[data-crumb]'); if (!a) return;
  const i = +a.dataset.crumb;
  if (i < 0) { state.trail = []; state.filter = null; state.level = 'gsp'; }
  else {
    const t = state.trail[i]; state.trail = state.trail.slice(0, i + 1);
    state.level = t.child; state.filter = t.child === 'secondary' ? null : t.id;
  }
  render(true);
});
document.getElementById('levels').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const lvl = b.dataset.level;
  // network-wide secondary view keeps the current map position; drilling from a primary still scopes it
  if (['secondary', 'smart', 'gas', 'water', 'telecoms', 'digonce'].includes(lvl)) { state.level = lvl; state.filter = null; state.trail = []; return render(false); }
  state.level = lvl; state.filter = null; state.trail = []; render(true);
});
document.getElementById('metrics').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.metric = b.dataset.metric; render(false);
});
document.getElementById('q').addEventListener('change', e => {
  if (!areaLayer) return;
  const q = e.target.value.toLowerCase();
  areaLayer.eachLayer(l => {
    if ((l.feature.properties.name || '').toLowerCase() === q) {
      l.getBounds ? map.fitBounds(l.getBounds()) : map.setView(l.getLatLng(), 12);
      l.openPopup();
    }
  });
});
document.getElementById('showLicence').addEventListener('change', async e => {
  if (!e.target.checked) { licenceLayer && map.removeLayer(licenceLayer); return; }
  const fc = await load('licence', 'data/gb/licence_areas.geojson');
  licenceLayer = L.geoJSON(fc, { style: { color: '#0b6bcb', weight: 1.2, fill: false, dashArray: '4 3' }, interactive: false }).addTo(map);
});

// Area filter: a local authority (upper tier: county / unitary = highway authority) and/or a DNO licence area.
// Every layer keeps only data inside the selection (both, when both are picked) and the rest of the map is dimmed.
const LIC_NAMES = {
  'SSE': 'SSEN North of Scotland', 'SSE (Southern)': 'SSEN Southern England',
  'SPEN (SP Distribution)': 'SPEN Central and Southern Scotland', 'SPEN (SP MANWEB)': 'SPEN Manweb (Merseyside and North Wales)',
  'NPG (Northern Electric)': 'Northern Powergrid North East', 'NPG (Yorkshire Electric)': 'Northern Powergrid Yorkshire',
  'ENWL': 'Electricity North West', 'UKPN (London)': 'UKPN London', 'UKPN (East)': 'UKPN East', 'UKPN (South)': 'UKPN South East',
  'WPD (Midlands)': 'NGED West Midlands', 'WPD (East Midlands)': 'NGED East Midlands',
  'WPD (South Wales)': 'NGED South Wales', 'WPD (South West)': 'NGED South West',
};
const licName = n => LIC_NAMES[n] || n;
const laBounds = f => (f._bounds ||= L.geoJSON(f).getBounds());
let areaMemo = [null, []];  // inArea() runs per point, so look the selection up once per change
function areaSel() {
  const key = `${state.la}|${state.lic}|${!!data.la}|${!!data.licence}`;
  if (areaMemo[0] !== key) areaMemo = [key, [
    state.la && data.la && data.la.features.find(f => f.properties.code === state.la),
    state.lic && data.licence && data.licence.features.find(f => f.properties.name === state.lic)].filter(Boolean)];
  return areaMemo[1];
}
const areaName = () => areaSel().map(f => f.properties.code ? f.properties.name : licName(f.properties.name)).join(' ∩ ');

// Point-in-polygon by even-odd ray casting over all rings, with edges bucketed into latitude bands so large
// authorities (thousands of vertices) stay fast against hundreds of thousands of points.
function pipTester(geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates, edges = [];
  let lo = Infinity, hi = -Infinity;
  for (const poly of polys) for (const ring of poly) for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    edges.push([ring[j][0], ring[j][1], ring[i][0], ring[i][1]]);
    lo = Math.min(lo, ring[i][1]); hi = Math.max(hi, ring[i][1]);
  }
  const N = 512, h = (hi - lo) / N || 1, bands = Array.from({ length: N }, () => []);
  const band = y => Math.min(N - 1, Math.max(0, Math.floor((y - lo) / h)));
  for (const e of edges) for (let k = band(Math.min(e[1], e[3])); k <= band(Math.max(e[1], e[3])); k++) bands[k].push(e);
  return (x, y) => {
    if (y < lo || y > hi) return false;
    let inside = false;
    for (const [x1, y1, x2, y2] of bands[band(y)])
      if ((y1 > y) !== (y2 > y) && x < (x2 - x1) * (y - y1) / (y2 - y1) + x1) inside = !inside;
    return inside;
  };
}
const inFeature = (f, lon, lat) => laBounds(f).contains([lat, lon]) && (f._pip ||= pipTester(f.geometry))(lon, lat);
const inArea = (lon, lat) => { const sel = areaSel(); return !sel.length || sel.every(f => inFeature(f, lon, lat)); };

// A feature is in the area if any of its vertices is (sampled), or, for areas, if it encloses the selection.
const areaKey = () => `${state.la}|${state.lic}`;
function featInArea(f) {
  const sel = areaSel();
  if (!sel.length) return true;
  const key = areaKey();
  if (f._area && f._area[0] === key) return f._area[1];
  const g = f.geometry, coords = [];
  const walk = c => typeof c[0] === 'number' ? coords.push(c) : c.forEach(walk);
  if (g) walk(g.coordinates);
  const step = Math.max(1, Math.floor(coords.length / 300));
  let hit = false;
  for (let i = 0; i < coords.length && !hit; i += step) hit = inArea(coords[i][0], coords[i][1]);
  if (!hit && g && /Polygon/.test(g.type)) {  // e.g. a GSP area that wholly contains a small council
    const c = laBounds(sel[0]).getCenter();
    hit = inArea(c.lng, c.lat) && (f._pip ||= pipTester(g))(c.lng, c.lat);
  }
  f._area = [key, hit];
  return hit;
}
// ~10 km grid squares (gas): keep a square if its centre or a corner is in the area
const cellInArea = k => {
  if (!areaSel().length) return true;
  const [x, y] = k.split('_').map(Number);
  return [[0.5, 0.5], [0, 0], [1, 0], [0, 1], [1, 1]].some(([dx, dy]) => inArea((x + dx) * CELL_LON, (y + dy) * CELL_LAT));
};

function fillAreaSelects() {
  if (data.la) document.getElementById('la').insertAdjacentHTML('beforeend', data.la.features.map(({ properties: p }) =>
    `<option value="${p.code}">${p.name}${p.streets ? ` · ${p.streets.toLocaleString()} dig-once streets` : ''}</option>`).join(''));
  if (data.licence) document.getElementById('lic').insertAdjacentHTML('beforeend', data.licence.features
    .map(f => f.properties.name).sort((a, b) => licName(a).localeCompare(licName(b)))
    .map(n => `<option value="${n}">${licName(n)}</option>`).join(''));
}
function applyArea() {
  if (areaShade) { map.removeLayer(areaShade); areaShade = null; }
  const sel = areaSel();
  document.getElementById('areaNote').style.display = sel.length ? '' : 'none';
  if (sel.length) {
    // dim everything outside each selected area (world ring with the area's outer rings as holes)
    const world = [[-89, -179], [-89, 179], [89, 179], [89, -179]];
    const outer = f => (f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates).map(p => p[0].map(([x, y]) => [y, x]));
    areaShade = L.layerGroup(sel.map(f => L.polygon([world, ...outer(f)], { pane: 'la', interactive: false,
      stroke: false, fillColor: '#1b1f24', fillOpacity: 0.28 }))
      .concat(sel.map(f => L.geoJSON(f, { pane: 'la', interactive: false, style: { color: '#6a3d9a', weight: 2.5, fill: false } })))).addTo(map);
    const b = sel.map(laBounds).reduce((a, x) => a.intersects(x) ? L.latLngBounds(
      [Math.max(a.getSouth(), x.getSouth()), Math.max(a.getWest(), x.getWest())],
      [Math.min(a.getNorth(), x.getNorth()), Math.min(a.getEast(), x.getEast())]) : a);
    map.fitBounds(b, { padding: [20, 20] });
  }
  render(false);
}
document.getElementById('showLA').addEventListener('change', async e => {
  if (laLayer) { map.removeLayer(laLayer); laLayer = null; }
  if (!e.target.checked) return;
  const fc = await load('la', 'data/gb/la.geojson');
  if (fc && e.target.checked) laLayer = L.geoJSON(fc, { pane: 'la', interactive: false,
    style: { color: '#6a3d9a', weight: 1, opacity: 0.7, fill: false } }).addTo(map);
});
document.getElementById('la').addEventListener('change', e => { state.la = e.target.value || null; applyArea(); });
document.getElementById('lic').addEventListener('change', e => { state.lic = e.target.value || null; applyArea(); });
document.getElementById('areaClear').addEventListener('click', e => {
  e.preventDefault(); state.la = state.lic = null;
  document.getElementById('la').value = document.getElementById('lic').value = '';
  applyArea();
});

document.getElementById('dno').addEventListener('change', e => {
  state.dno = e.target.value; state.trail = []; state.filter = null;
  render(!['secondary', 'smart', 'gas', 'water', 'telecoms', 'digonce'].includes(state.level));
});

(async () => {
  manifest = await load('manifest', 'data/gb/manifest.json') || {};
  document.getElementById('dno').insertAdjacentHTML('beforeend', Object.entries(manifest)
    .filter(([, m]) => m.counts).map(([d, m]) => `<option value="${d}">${m.title} (${d})</option>`).join(''));
  document.getElementById('showLicence').dispatchEvent(new Event('change'));
  render(true);
  Promise.all([load('la', 'data/gb/la.geojson'), load('licence', 'data/gb/licence_areas.geojson')]).then(fillAreaSelects);
})();
</script>
</body>
